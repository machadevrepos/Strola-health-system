name: strola_health
description: "Premium BLE step counter with Apple-level polish"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI & Animations
  flutter_animate: ^4.5.0
  animate_icons: ^2.0.0
  glassmorphism: ^3.0.0
  confetti: ^0.7.0
  flex_color_scheme: ^8.4.0

  # Charts & Gauges
  fl_chart: ^0.68.0
  syncfusion_flutter_gauges: ^28.1.0

  # BLE & Hardware
  flutter_reactive_ble: ^5.4.0
  permission_handler: ^11.3.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Animations & Polish
  lottie: ^3.1.0
  skeletonizer: ^2.1.3

  # Maps & GPS
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # UI Components
  numberpicker: ^2.1.2
  table_calendar: ^3.1.2

  # Utilities
  intl: ^0.19.0
  timeago: ^3.7.0
  sensors_plus: ^6.1.1

  # Home & Lock Screen Widgets
  home_widget: ^0.7.0
  font_awesome_flutter: ^11.0.0

  # Media
  image_picker: ^1.2.2
  image_cropper: ^9.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Auth & backend connectivity
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.1.6
  firebase_messaging: ^15.1.6
  dio: ^5.7.0
  url_launcher: ^6.3.1

  # Health platform integrations (Apple Health / Android Health Connect)
  health: ^12.1.0
  # Strava / Oura / Garmin OAuth — captures the redirect callback
  flutter_web_auth_2: ^4.1.0

  # Subscriptions / purchases
  purchases_flutter: ^8.4.4
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  firebase_crashlytics: ^4.3.10
  firebase_analytics: ^11.6.0
  firebase_app_check: ^0.3.2+10
  firebase_storage: ^12.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding/
